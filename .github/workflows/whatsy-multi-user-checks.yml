name: Whatsy multi-user checks

on:
  push:
    branches:
      - feature/multi-user-whatsy
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js src/moderation/*.js public/*.js; do
            node --check "$file"
          done
      - name: Run tests
        run: npm test
